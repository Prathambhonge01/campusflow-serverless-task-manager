<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CampusFlow – Student task manager</title>
<script>try{var t=localStorage.getItem('taskflow-aurora-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f1f3ff;--o1:#b9a8ff;--o2:#8ee6ff;--o3:#ffc2dc;--glass:#ffffffa6;--glass2:#ffffffd9;--edge:#ffffffd0;--line:#1b1f4026;--ink:#171a3a;--muted:#5d628a;--a:#7a5cff;--b:#16b8e6;--high:#ff4f84;--med:#f5a524;--low:#17b97f;--shadow:0 12px 40px #4a3fb024;color-scheme:light}
:root[data-theme=dark]{--bg:#070914;--o1:#4b2fd6;--o2:#0aa3c9;--o3:#b4237a;--glass:#ffffff0f;--glass2:#ffffff17;--edge:#ffffff1c;--line:#ffffff1f;--ink:#eef0ff;--muted:#9aa0c9;--a:#9b86ff;--b:#35d6ff;--high:#ff6d9a;--med:#ffbd4a;--low:#38e0a0;--shadow:0 12px 40px #0008;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070914;--o1:#4b2fd6;--o2:#0aa3c9;--o3:#b4237a;--glass:#ffffff0f;--glass2:#ffffff17;--edge:#ffffff1c;--line:#ffffff1f;--ink:#eef0ff;--muted:#9aa0c9;--a:#9b86ff;--b:#35d6ff;--high:#ff6d9a;--med:#ffbd4a;--low:#38e0a0;--shadow:0 12px 40px #0008;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.5 "Manrope",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.orb.a{width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--o1)}
.orb.b{width:40vw;height:40vw;right:-8vw;top:20vh;background:var(--o2);animation-delay:-8s}
.orb.c{width:36vw;height:36vw;left:25vw;bottom:-18vw;background:var(--o3);animation-delay:-14s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:22px 20px 70px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.logo{margin-right:auto;font:800 21px "Sora",sans-serif;letter-spacing:-.04em;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.kbar{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-radius:99px;color:var(--muted);font-weight:600;font-size:14px;border:1px solid var(--edge);background:var(--glass)}
.kbar kbd{font:700 11px "Manrope",sans-serif;padding:2px 7px;border-radius:7px;border:1px solid var(--line)}
.kbar:hover{background:var(--glass2)}
.round{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass)}
.round:hover{background:var(--glass2)}
.i-sun{display:none}
:root[data-theme=dark] .i-sun{display:block}:root[data-theme=dark] .i-moon{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .i-sun{display:block}:root:not([data-theme=light]) .i-moon{display:none}}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 30px;margin-bottom:22px}
.hero small{color:var(--muted);font-weight:700}
h1{margin:4px 0 10px;font:800 clamp(28px,5vw,40px)/1.08 "Sora",sans-serif;letter-spacing:-.04em}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--glass2);border:1px solid var(--edge);font-size:13px;font-weight:700}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{width:118px;height:118px;transform:rotate(-90deg);stroke-width:10}
.ring .tr{stroke:var(--line)}
.ring .pg{stroke:url(#rg);transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 24px "Sora",sans-serif;letter-spacing:-.03em}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.tabs{position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px}
.tabs button{position:relative;z-index:1;padding:10px;border:0;background:none;font-weight:700;color:var(--muted);border-radius:12px;transition:color .2s}
.tabs button.on{color:#fff}
.ind{position:absolute;top:4px;left:4px;width:calc((100% - 8px)/3);height:calc(100% - 8px);border-radius:12px;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 6px 18px #7a5cff55;transition:transform .3s cubic-bezier(.3,.8,.2,1)}
.tabs[data-i="1"] .ind{transform:translateX(100%)}.tabs[data-i="2"] .ind{transform:translateX(200%)}
.add{display:flex;align-items:center;gap:8px;padding:12px 18px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700}
.add:active{transform:scale(.96)}
.list{display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;transition:transform .18s,background .18s;animation:in .3s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.task:hover{transform:translateY(-2px);background:var(--glass2)}
.chk{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;padding:0;transition:all .2s}
.chk svg{width:15px;height:15px;stroke-width:3.4}
.chk:hover{border-color:var(--b)}
.chk.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.t{margin:0;font-weight:700;overflow-wrap:anywhere}
.done .t{color:var(--muted);text-decoration:line-through}
.sub{margin:0;font-size:12.5px;color:var(--muted)}
.pr{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted)}
.pr i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.st{padding:6px 12px;border-radius:99px;border:1px solid var(--edge);background:var(--glass2);font-size:12.5px;font-weight:700;white-space:nowrap}
.st:hover{border-color:var(--a)}
.st.p{background:linear-gradient(120deg,#7a5cff33,#16b8e633);border-color:#7a5cff55}
.edit{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:10px;background:none;color:var(--muted)}
.edit:hover{background:var(--glass2);color:var(--ink)}
.hi{--c:var(--high)}.me{--c:var(--med)}.lo{--c:var(--low)}
.empty{padding:46px 20px;text-align:center}
.empty b{display:block;font:700 20px "Sora",sans-serif}
.empty p{margin:4px 0 0;color:var(--muted)}
.ov{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;padding:20px;background:#04061066;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ov[hidden]{display:none}
.ov.pal-ov{align-items:flex-start;padding-top:14vh}.ov.mod-ov{align-items:center}
.pal,.modal{width:100%;background:var(--bg);animation:in .2s both}
.pal{max-width:540px;overflow:hidden}
.pal input{width:100%;padding:18px 22px;border:0;border-bottom:1px solid var(--line);background:none;outline:0;font-size:17px;font-weight:600}
.pal ul{list-style:none;margin:0;padding:8px;max-height:320px;overflow:auto}
.pal li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:600;cursor:pointer}
.pal li.sel{background:linear-gradient(120deg,#7a5cff33,#16b8e626)}
.pal li small{margin-left:auto;color:var(--muted);font-weight:600}
.pal-foot{padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.modal{position:relative;max-width:440px;padding:28px}
.modal h2{margin:0 0 18px;font:800 26px "Sora",sans-serif;letter-spacing:-.04em}
.x{position:absolute;top:12px;right:16px;border:0;background:none;font-size:28px;line-height:1;color:var(--muted)}
.modal label{display:grid;gap:6px;margin-bottom:16px;font-size:13px;font-weight:700;color:var(--muted)}
.modal input,.modal select{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass);outline:0;font-weight:600}
.modal input:focus,.modal select:focus{border-color:var(--a)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acts{display:flex;gap:10px}.acts .add{flex:1;justify-content:center;background:linear-gradient(120deg,var(--a),var(--b));color:#fff}
.acts .del{padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:none;color:var(--high);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;padding:11px 20px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.kbar span,.kbar kbd{display:none}.kbar{padding:0;width:40px;height:40px;justify-content:center;border-radius:50%}.hero{padding:22px;flex-direction:column-reverse;align-items:flex-start}.bar{flex-direction:column;align-items:stretch}.task{grid-template-columns:auto 1fr auto;gap:12px}.task .pr{display:none}.task .st{grid-column:2;justify-self:start}.task .edit{grid-row:1;grid-column:3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<i class="orb a"></i><i class="orb b"></i><i class="orb c"></i>
<div class="wrap">
  <header class="top">
    <span class="logo">CampusFlow</span>
    <button class="kbar" id="open-pal" aria-label="Open command palette"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search or add</span><kbd id="kkey">Ctrl K</kbd></button>
    <button class="round" id="theme-toggle" aria-label="Switch theme"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </header>

  <section class="hero glass">
    <div>
      <small id="today"></small>
      <h1 id="greeting">Hello.</h1>
      <div class="chips">
        <span class="chip" style="--c:var(--low)"><i></i><b id="completed-count">0</b> done</span>
        <span class="chip" style="--c:var(--a)"><i></i><b id="progress-count">0</b> in progress</span>
        <span class="chip" style="--c:var(--med)"><i></i><b id="pending-count">0</b> pending</span>
      </div>
    </div>
    <div class="ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#16b8e6"/></linearGradient></defs><circle class="tr" cx="60" cy="60" r="50"/><circle class="pg" id="pg" cx="60" cy="60" r="50" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg><b id="pct">0%</b></div>
  </section>

  <div class="bar">
    <div class="tabs glass" id="tabs" data-i="0" role="tablist" style="border-radius:16px;box-shadow:none">
      <i class="ind"></i>
      <button class="on" data-view="all" role="tab">All <span id="n-all"></span></button>
      <button data-view="active" role="tab">Active <span id="n-active"></span></button>
      <button data-view="done" role="tab">Done <span id="n-done"></span></button>
    </div>
    <button class="add" id="new-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New task</button>
  </div>

  <main class="list" id="list" aria-live="polite"></main>
</div>

<div class="ov pal-ov" id="pal" hidden>
  <div class="pal glass" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="pal-input" placeholder="Type a task to add, or a command…" autocomplete="off" />
    <ul id="pal-list"></ul>
    <div class="pal-foot">↑ ↓ to move · Enter to run · Esc to close</div>
  </div>
</div>

<div class="ov mod-ov" id="modal" hidden>
  <section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="x" data-close aria-label="Close dialog">×</button>
    <h2 id="modal-title">Add task</h2>
    <form id="task-form">
      <label>What needs doing?<input id="title" required maxlength="120" placeholder="Submit project report" autocomplete="off" /></label>
      <div class="two">
        <label>Priority<select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
        <label>Status<select id="status"><option selected>Pending</option><option>In Progress</option><option>Completed</option></select></label>
      </div>
      <div class="acts"><button type="button" class="del" id="delete-btn" hidden>Delete</button><button class="add" type="submit" id="save-btn">Add task</button></div>
    </form>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'taskflow-demo-tasks';
const CYCLE = ['Pending', 'In Progress', 'Completed'];
const VIEWS = ['all', 'active', 'done'];
const state = { tasks: [], editingId: null, view: 'all', sel: 0, cmds: [] };
const $ = (s) => document.querySelector(s);
const OK = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const PEN = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
const PC = { High: 'hi', Medium: 'me', Low: 'lo' };

function seed() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch {}
  return [
    { id: 'T101', title: 'Complete Cloud Computing assignment', priority: 'High', status: 'In Progress', createdDate: '2026-10-28' },
    { id: 'T102', title: 'Prepare project presentation', priority: 'Medium', status: 'Pending', createdDate: '2026-10-26' },
    { id: 'T103', title: 'Submit final year project report', priority: 'High', status: 'Completed', createdDate: '2026-10-21' }
  ];
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state.tasks)); } catch {} };
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
const fmt = (v) => new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric' }).format(new Date(`${v}T00:00:00`));
const api = (p, m, b) => fetch(`/api/tasks${p}`, { method: m, headers: { 'Content-Type': 'application/json' }, body: b && JSON.stringify(b) }).catch(() => {});
const isOpen = (t) => t.status !== 'Completed';

function render() {
  const all = state.tasks, n = all.length, done = all.filter((t) => !isOpen(t)).length, prog = all.filter((t) => t.status === 'In Progress').length;
  const pct = n ? Math.round((done / n) * 100) : 0;
  $('#completed-count').textContent = done; $('#progress-count').textContent = prog; $('#pending-count').textContent = n - done - prog;
  $('#pct').textContent = `${pct}%`; $('#pg').style.strokeDashoffset = 314.16 * (1 - pct / 100);
  $('#n-all').textContent = n; $('#n-active').textContent = n - done; $('#n-done').textContent = done;
  $('#tabs').dataset.i = VIEWS.indexOf(state.view);
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === state.view));
  const list = all.filter((t) => state.view === 'active' ? isOpen(t) : state.view === 'done' ? !isOpen(t) : true);
  $('#list').innerHTML = list.map((t, i) => `
    <article class="task glass ${PC[t.priority]} ${isOpen(t) ? '' : 'done'}" style="animation-delay:${i * 40}ms">
      <button class="chk ${isOpen(t) ? '' : 'on'}" data-complete="${t.id}" aria-label="Toggle ${esc(t.title)}">${OK}</button>
      <div><p class="t">${esc(t.title)}</p><p class="sub">${t.id} · added ${fmt(t.createdDate)}</p></div>
      <span class="pr"><i></i>${t.priority}</span>
      <button class="st ${t.status === 'In Progress' ? 'p' : ''}" data-cycle="${t.id}" title="Change status">${t.status}</button>
      <button class="edit" data-edit="${t.id}" aria-label="Edit ${esc(t.title)}">${PEN}</button>
    </article>`).join('') || `<div class="empty glass"><b>${state.view === 'done' ? 'Nothing finished yet' : state.view === 'active' ? 'All caught up' : 'No tasks yet'}</b><p>Press ${/Mac/.test(navigator.platform) ? '⌘' : 'Ctrl'} K and type to add one.</p></div>`;
}

let tt;
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2200); }
function setStatus(id, status) { const t = state.tasks.find((x) => x.id === id); if (!t) return; t.status = status; persist(); render(); api(`/${id}`, 'PUT', { status }); }
function addTask(title, priority = 'Medium', status = 'Pending') {
  state.tasks.unshift({ id: `T${Date.now().toString(36).slice(-4).toUpperCase()}`, title, priority, status, createdDate: new Date().toISOString().slice(0, 10) });
  api('', 'POST', { title, priority, status }); persist(); render();
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('taskflow-aurora-theme', next); } catch {}
}
function openModal(t) {
  state.editingId = t?.id || null;
  $('#modal-title').textContent = t ? 'Edit task' : 'Add task';
  $('#save-btn').textContent = t ? 'Save changes' : 'Add task';
  $('#delete-btn').hidden = !t;
  $('#title').value = t?.title || ''; $('#priority').value = t?.priority || 'Medium'; $('#status').value = t?.status || 'Pending';
  $('#modal').hidden = false; $('#title').focus();
}
const closeModal = () => { $('#modal').hidden = true; state.editingId = null; };

/* command palette */
function palItems() {
  const q = $('#pal-input').value.trim(), lq = q.toLowerCase();
  const base = [
    { l: 'Show all tasks', k: 'View', run: () => { state.view = 'all'; render(); } },
    { l: 'Show active tasks', k: 'View', run: () => { state.view = 'active'; render(); } },
    { l: 'Show completed tasks', k: 'View', run: () => { state.view = 'done'; render(); } },
    { l: 'New task with details…', k: 'Action', run: () => openModal() },
    { l: 'Toggle light / dark theme', k: 'Action', run: toggleTheme }
  ].filter((c) => !lq || c.l.toLowerCase().includes(lq));
  const found = lq ? state.tasks.filter((t) => t.title.toLowerCase().includes(lq)).slice(0, 4).map((t) => ({ l: t.title, k: t.status, run: () => openModal(t) })) : [];
  const add = q ? [{ l: `Add “${q}” as a task`, k: 'Enter', run: () => { addTask(q); toast('Task added'); } }] : [];
  return [...add, ...found, ...base];
}
function palRender() {
  state.cmds = palItems(); state.sel = Math.min(state.sel, Math.max(state.cmds.length - 1, 0));
  $('#pal-list').innerHTML = state.cmds.map((c, i) => `<li class="${i === state.sel ? 'sel' : ''}" data-i="${i}">${esc(c.l)}<small>${esc(c.k)}</small></li>`).join('') || '<li>No results</li>';
}
function openPal() { $('#pal').hidden = false; $('#pal-input').value = ''; state.sel = 0; palRender(); $('#pal-input').focus(); }
const closePal = () => { $('#pal').hidden = true; };
function runPal(i) { const c = state.cmds[i]; if (!c) return; closePal(); c.run(); }

$('#pal-input').addEventListener('input', () => { state.sel = 0; palRender(); });
$('#pal-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); state.sel = (state.sel + 1) % state.cmds.length; palRender(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); state.sel = (state.sel - 1 + state.cmds.length) % state.cmds.length; palRender(); }
  if (e.key === 'Enter') { e.preventDefault(); runPal(state.sel); }
});
$('#pal-list').addEventListener('click', (e) => { const li = e.target.closest('[data-i]'); if (li) runPal(Number(li.dataset.i)); });
$('#pal').addEventListener('click', (e) => { if (e.target === $('#pal')) closePal(); });

$('#task-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const p = { title: $('#title').value.trim(), priority: $('#priority').value, status: $('#status').value };
  if (!p.title) return;
  const id = state.editingId;
  if (id) { state.tasks = state.tasks.map((t) => (t.id === id ? { ...t, ...p } : t)); api(`/${id}`, 'PUT', p); persist(); render(); }
  else addTask(p.title, p.priority, p.status);
  closeModal(); toast(id ? 'Changes saved' : 'Task added');
});
$('#delete-btn').addEventListener('click', () => {
  const id = state.editingId; if (!id) return;
  state.tasks = state.tasks.filter((t) => t.id !== id); api(`/${id}`, 'DELETE'); persist(); render(); closeModal(); toast('Task deleted');
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-close]') || t === $('#modal')) closeModal();
  const ed = t.closest('[data-edit]'); if (ed) openModal(state.tasks.find((x) => x.id === ed.dataset.edit));
  const c = t.closest('[data-complete]');
  if (c) { const k = state.tasks.find((x) => x.id === c.dataset.complete); if (k) { const s = isOpen(k) ? 'Completed' : 'Pending'; setStatus(k.id, s); toast(s === 'Completed' ? 'Task completed' : 'Task reopened'); } }
  const cy = t.closest('[data-cycle]'); if (cy) { const k = state.tasks.find((x) => x.id === cy.dataset.cycle); setStatus(k.id, CYCLE[(CYCLE.indexOf(k.status) + 1) % 3]); }
  const v = t.closest('[data-view]'); if (v) { state.view = v.dataset.view; render(); }
});
$('#new-btn').addEventListener('click', () => openModal());
$('#open-pal').addEventListener('click', openPal);
$('#theme-toggle').addEventListener('click', toggleTheme);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').hidden ? openPal() : closePal(); }
  if (e.key === 'Escape') { closePal(); if (!$('#modal').hidden) closeModal(); }
});
async function sync() { try { const r = await fetch('/api/tasks'); if (r.ok) { state.tasks = await r.json(); persist(); render(); } } catch {} }

const now = new Date(), h = now.getHours();
$('#kkey').textContent = /Mac/.test(navigator.platform) ? '⌘ K' : 'Ctrl K';
$('#today').textContent = new Intl.DateTimeFormat('en', { weekday: 'long', day: 'numeric', month: 'long' }).format(now);
$('#greeting').innerHTML = `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, <em>let’s flow.</em>`;
state.tasks = seed(); render(); sync();
</script>
</body>
</html>
